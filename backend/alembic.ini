# Alembic configuration file for AegisPay AI

[alembic]
# Path to migration scripts
script_location = app/db/migrations

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Sys.path prepends
prepend_sys_path = .

# Timezone to use when generating dates in migration files
timezone = UTC

# Max length of characters to apply to the slug field
truncate_slug_length = 40

# Run the environment during the 'revision' command
revision_environment = false

# Allow sourceless (.pyc / .pyo) files in the versions directory
sourceless = false

# Version table name
version_table = alembic_version

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
